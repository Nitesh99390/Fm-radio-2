<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priya Infinity Pro</title>
    <meta name="theme-color" content="#0b0b1a">

    <!-- Fonts & Icons (CDN only) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ============ Design Tokens ============ */
        :root {
            --bg-0: #07070f;
            --bg-1: #0d0d1f;
            --surface: rgba(255, 255, 255, 0.06);
            --surface-strong: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.12);
            --text-1: #f4f4fb;
            --text-2: #b7b7cf;
            --text-3: #7e7e9c;
            --accent: #ff3d5a;
            --accent-2: #7c5cff;
            --accent-3: #22d3ee;
            --glow-red: rgba(255, 61, 90, 0.55);
            --glow-grey: rgba(255, 255, 255, 0.35);
            --shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
            --font-display: 'Space Grotesk', 'Inter', sans-serif;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        [data-theme="light"] {
            --bg-0: #eef1fb;
            --bg-1: #ffffff;
            --surface: rgba(20, 20, 40, 0.05);
            --surface-strong: rgba(20, 20, 40, 0.08);
            --border: rgba(20, 20, 40, 0.14);
            --text-1: #14142a;
            --text-2: #4a4a68;
            --text-3: #7a7a98;
            --glow-red: rgba(255, 61, 90, 0.35);
            --glow-grey: rgba(60, 60, 90, 0.3);
            --shadow: 0 24px 60px rgba(40, 40, 90, 0.18);
        }

        /* ============ Reset & Base ============ */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            color: var(--text-1);
            line-height: 1.65;
            background: var(--bg-0);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.5s var(--ease), color 0.5s var(--ease);
        }

        /* Animated aurora background */
        .aurora {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(42% 55% at 12% 18%, rgba(124, 92, 255, 0.28), transparent 60%),
                radial-gradient(38% 48% at 88% 12%, rgba(255, 61, 90, 0.22), transparent 60%),
                radial-gradient(46% 52% at 78% 88%, rgba(34, 211, 238, 0.18), transparent 60%),
                linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, var(--bg-0));
            background-size: 160% 160%;
            animation: auroraShift 18s ease-in-out infinite;
        }

        @keyframes auroraShift {
            0%   { background-position: 0% 0%; }
            50%  { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        /* Subtle grid overlay */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, #000 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 20%, #000 30%, transparent 75%);
            opacity: 0.5;
        }

        /* ============ Layout ============ */
        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

        /* ============ Navbar ============ */
        .nav {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: color-mix(in srgb, var(--bg-0) 62%, transparent);
            border-bottom: 1px solid var(--border);
        }
        .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 68px; }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-1); }
        .brand-logo {
            width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff; font-size: 20px; box-shadow: 0 8px 22px var(--glow-red);
        }
        .brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.2px; }
        .nav-actions { display: flex; align-items: center; gap: 14px; }

        /* Theme toggle */
        .theme-toggle {
            width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-1); font-size: 1rem;
            cursor: pointer; display: grid; place-items: center;
            transition: transform 0.3s var(--ease), background 0.3s var(--ease);
        }
        .theme-toggle:hover { transform: rotate(18deg) scale(1.06); background: var(--surface-strong); }

        /* ============ Hero ============ */
        .hero { padding: 84px 0 56px; text-align: center; position: relative; }
        .hero h1 {
            font-family: var(--font-display); font-size: clamp(2.4rem, 6vw, 4.2rem);
            font-weight: 700; line-height: 1.08; letter-spacing: -0.5px; margin-bottom: 30px;
        }
        .grad-text {
            background: linear-gradient(100deg, var(--accent) 10%, var(--accent-2) 55%, var(--accent-3) 95%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }

        /* Download buttons */
        .download-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; margin-bottom: 20px; }
        .download-btn {
            position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
            gap: 14px; min-width: 280px; padding: 18px 30px; border-radius: 18px; color: #fff;
            text-decoration: none; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem;
            border: 1px solid transparent; transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
        }
        .download-btn .btn-sub {
            display: block; font-family: var(--font-body); font-weight: 500; font-size: 0.76rem;
            opacity: 0.78; letter-spacing: 0.3px;
        }
        .download-btn .btn-icon { font-size: 1.5rem; }
        .ripple {
            position: absolute; border-radius: 50%; transform: scale(0);
            background: rgba(255, 255, 255, 0.45); pointer-events: none;
            animation: rippleAnim 0.7s var(--ease) forwards;
        }
        @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }
        .gofile-btn {
            background: linear-gradient(135deg, #ff2d55, #ff3d5a 55%, #e11d48);
            box-shadow: 0 0 18px var(--glow-red), 0 18px 40px rgba(255, 45, 85, 0.28);
        }
        .gofile-btn:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 0 42px var(--glow-red), 0 26px 56px rgba(255, 45, 85, 0.4); }
        .github-btn {
            background: linear-gradient(135deg, #3a3a46, #2a2a34); border-color: var(--border);
            box-shadow: 0 0 16px var(--glow-grey), 0 18px 40px rgba(0, 0, 0, 0.35);
        }
        .github-btn:hover {
            transform: translateY(-4px) scale(1.02); background: linear-gradient(135deg, #2c2c38, #1d1d26);
            box-shadow: 0 0 34px var(--glow-grey), 0 26px 56px rgba(0, 0, 0, 0.5);
        }
        .download-btn:active { transform: translateY(-1px) scale(0.98); }

        /* ============ Footer ============ */
        footer { border-top: 1px solid var(--border); padding: 44px 0 40px; margin-top: 40px; }
        .footer-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 18px; }
        .footer-brand { display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 0.92rem; }
        .footer-brand i { color: var(--accent); }

        /* ============ Scroll reveal ============ */
        .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
        .reveal.visible { opacity: 1; transform: translateY(0); }

        /* ============ Responsive ============ */
        @media (max-width: 720px) {
            .hero { padding: 60px 0 44px; }
            .download-btn { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="aurora" aria-hidden="true"></div>
    <div class="grid-overlay" aria-hidden="true"></div>

    <header class="nav">
        <div class="wrap nav-inner">
            <a class="brand" href="#top" aria-label="Priya Infinity Pro home">
                <span class="brand-logo" aria-hidden="true"><i class="fa-solid fa-infinity"></i></span>
                <span class="brand-name">Priya Infinity Pro</span>
            </a>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light theme" title="Toggle theme">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </header>

    <main id="top">
        <section class="hero">
            <div class="wrap">
                <h1 class="reveal">Priya <span class="grad-text">Infinity Pro</span></h1>

                <div class="download-grid reveal">
                    <a href="https://gofile.io/d/WJiDOqiP" class="download-btn gofile-btn" target="_blank" rel="noopener noreferrer">
                        <span class="btn-icon" aria-hidden="true"><i class="fa-solid fa-cloud-arrow-down"></i></span>
                        <span>
                            Download from GoFile
                            <span class="btn-sub">.apk</span>
                        </span>
                    </a>

                    <a href="https://github.com/Nitesh99390/YouTube-/releases/download/Hello0/app-debug.signed.apk" class="download-btn github-btn" target="_blank" rel="noopener noreferrer">
                        <span class="btn-icon" aria-hidden="true"><i class="fa-brands fa-github"></i></span>
                        <span>
                            Download from GitHub
                            <span class="btn-sub">.apk</span>
                        </span>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="wrap footer-inner">
            <div class="footer-brand">
                <i class="fa-solid fa-infinity" aria-hidden="true"></i>
                <span>Priya Infinity Pro — by Nitesh99390</span>
            </div>
        </div>
    </footer>

    <script>
        const toggle = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            icon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
            try { localStorage.setItem('priya-theme', theme); } catch (e) {}
        }

        let saved = null;
        try { saved = localStorage.getItem('priya-theme'); } catch (e) {}
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(saved || (prefersDark ? 'dark' : 'light'));

        toggle.addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            applyTheme(next);
        });

        document.querySelectorAll('.download-btn').forEach(btn => {
            btn.addEventListener('click', function (e) {
                const rect = this.getBoundingClientRect();
                const d = Math.max(rect.width, rect.height) * 1.2;
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                ripple.style.width = ripple.style.height = d + 'px';
                ripple.style.left = (e.clientX - rect.left - d / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - d / 2) + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 750);
            });
        });

        const revealEls = document.querySelectorAll('.reveal');
        if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            const io = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        io.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
            revealEls.forEach(el => io.observe(el));
        } else {
            revealEls.forEach(el => el.classList.add('visible'));
        }
    </script>
</body>
</html>
